name: Gerar APK do RIVO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'capacitor.config.json', 'package.json']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Permissões de localização em segundo plano
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS WAKE_LOCK; do
            grep -q "android.permission.$P" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
          grep -n "permission" $M
      - name: Ícone do app
        run: |
          pip install pillow --break-system-packages
          python3 - <<'PY'
          import os,glob,shutil
          from PIL import Image
          src=Image.open('www/rivo-icons/icon-512.png').convert('RGBA')
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26',ignore_errors=True)
          for d,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  src.resize((sz,sz),Image.LANCZOS).save(f'{res}/mipmap-{d}/{n}')
          PY
      - run: npx cap sync android
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rivo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rivo-apk
          path: rivo.apk
      - name: Publicar link direto (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RIVO APK (mais recente)
          files: rivo.apk
          make_latest: true
