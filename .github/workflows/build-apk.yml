name: Gerar APK do RIVO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'native/**', 'google-services.json', 'capacitor.config.json', 'package.json', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Permissões (localização, notificações, alerta em tela cheia)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS WAKE_LOCK USE_FULL_SCREEN_INTENT VIBRATE REQUEST_IGNORE_BATTERY_OPTIMIZATIONS REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$P" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
          grep -n "permission" $M
      - name: Alerta nativo (push do Firebase, tela cheia, toques)
        run: |
          cp google-services.json android/app/google-services.json
          D=android/app/src/main/java/com/dcastrolabs/rivo
          mkdir -p $D android/app/src/main/res/raw
          cp native/java/*.java $D/
          cp native/raw/*.wav android/app/src/main/res/raw/
          python3 native/patch_android.py
          grep -n "firebase\|google-services" android/build.gradle android/app/build.gradle || true
          grep -n "RivoMessagingService\|AlertService\|showWhenLocked" android/app/src/main/AndroidManifest.xml
      - name: Ícone do app (fundo liso + asas grandes)
        run: |
          pip install pillow --break-system-packages
          python3 - <<'PY'
          import os, shutil
          from PIL import Image, ImageDraw, ImageChops

          src = Image.open('www/rivo-icons/icon-512.png').convert('RGBA')
          # 1) acha o desenho (ignora margem transparente) e tira a borda azul e os cantos arredondados
          bb = src.getchannel('A').point(lambda v: 255 if v > 20 else 0).getbbox() or (0, 0, src.width, src.height)
          w = bb[2] - bb[0]
          m = int(w * 0.09)
          core = src.crop((bb[0] + m, bb[1] + m, bb[2] - m, bb[3] - m)).convert('RGB')
          # 2) cor de fundo = cor do canto do miolo
          px = core.load(); n = max(4, core.width // 25)
          cs = [px[x, y] for x in range(2, n) for y in range(2, n)]
          bg = tuple(sorted(c[i] for c in cs)[len(cs) // 2] for i in range(3))
          lum = lambda c: 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]
          bl = lum(bg)
          # 3) transparência = o quanto cada ponto é mais claro que o fundo (sobram só as asas)
          alpha = core.convert('L').point(lambda v: max(0, min(255, int((v - bl - 25) * 255 / 60))))
          asas = core.convert('RGBA'); asas.putalpha(alpha)
          caixa = alpha.point(lambda v: 255 if v > 40 else 0).getbbox() or (0, 0, core.width, core.height)
          asas = asas.crop(caixa)

          def compor(tam, frac, fundo):
              # coloca as asas centralizadas, ocupando 'frac' da largura (sem passar de 'frac' da altura)
              k = min(tam * frac / asas.width, tam * frac / asas.height)
              a = asas.resize((max(1, round(asas.width * k)), max(1, round(asas.height * k))), Image.LANCZOS)
              t = Image.new('RGBA', (tam, tam), (bg + (255,)) if fundo else (0, 0, 0, 0))
              t.alpha_composite(a, ((tam - a.width) // 2, (tam - a.height) // 2))
              return t

          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          os.makedirs(res + '/mipmap-anydpi-v26', exist_ok=True)
          # Android 8+: ícone adaptivo (fundo cor lisa + asas grandes na parte segura de 66%)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for nome in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(res + '/mipmap-anydpi-v26/' + nome, 'w').write(xml)
          os.makedirs(res + '/values', exist_ok=True)
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%02X%02X%02X</color>\n</resources>\n' % bg)
          for d, dp in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              pasta = f'{res}/mipmap-{d}'
              os.makedirs(pasta, exist_ok=True)
              compor(round(108 * dp), 0.62, False).save(f'{pasta}/ic_launcher_foreground.png')
              leg = compor(round(48 * dp), 0.80, True)
              leg.save(f'{pasta}/ic_launcher.png')
              mask = Image.new('L', leg.size, 0); ImageDraw.Draw(mask).ellipse((0, 0, leg.width - 1, leg.height - 1), fill=255)
              red = leg.copy(); red.putalpha(mask); red.save(f'{pasta}/ic_launcher_round.png')
          print('Ícone: fundo #%02X%02X%02X, asas %dx%d' % (bg + asas.size))
          PY
      - name: Número da versão no app
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/rivo.html
          grep -c "'${{ github.run_number }}'" www/rivo.html
          cp www/rivo.html www/index.html
      - run: npx cap sync android
      - name: Assinatura fixa (para o app atualizar por cima, sem desinstalar)
        env:
          KS: ${{ secrets.RIVO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa ligada."
          else
            echo "ATENCAO: sem o segredo RIVO_KEYSTORE_B64; o APK sai com assinatura nova e não atualiza por cima do antigo."
          fi
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rivo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rivo-apk
          path: rivo.apk
      - name: Apagar a release antiga (o arquivo sempre sai novo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest --cleanup-tag --yes || true
      - name: Publicar link direto (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RIVO APK (mais recente)
          files: rivo.apk
          body: "build ${{ github.run_number }}"
          overwrite_files: true
          make_latest: true
