name: Gerar APK do RIVO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'native/**', 'google-services.json', 'capacitor.config.json', 'package.json', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Permissões (localização, notificações, alerta em tela cheia)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS WAKE_LOCK USE_FULL_SCREEN_INTENT VIBRATE REQUEST_IGNORE_BATTERY_OPTIMIZATIONS REQUEST_INSTALL_PACKAGES; do
            grep -q "android.permission.$P" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $M
          done
          grep -n "permission" $M
      - name: Alerta nativo (push do Firebase, tela cheia, toques)
        run: |
          cp google-services.json android/app/google-services.json
          D=android/app/src/main/java/com/dcastrolabs/rivo
          mkdir -p $D android/app/src/main/res/raw
          cp native/java/*.java $D/
          cp native/raw/*.wav android/app/src/main/res/raw/
          python3 native/patch_android.py
          grep -n "firebase\|google-services" android/build.gradle android/app/build.gradle || true
          grep -n "RivoMessagingService\|AlertService\|showWhenLocked" android/app/src/main/AndroidManifest.xml
      - name: Ícones do app e da notificação (prontos em native/res)
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r native/res/. android/app/src/main/res/
          ls android/app/src/main/res/drawable-xxhdpi android/app/src/main/res/mipmap-xxhdpi
      - name: Número da versão no app
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/rivo.html
          grep -c "'${{ github.run_number }}'" www/rivo.html
          # um arquivo só no app: rivo.html vira index.html (o site continua usando rivo.html)
          mv www/rivo.html www/index.html
          rm -f www/rivo.webmanifest www/rivo-sw.js
      - run: npx cap sync android
      - name: Assinatura fixa (para o app atualizar por cima, sem desinstalar)
        env:
          KS: ${{ secrets.RIVO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Assinatura fixa ligada."
          else
            echo "ATENCAO: sem o segredo RIVO_KEYSTORE_B64; o APK sai com assinatura nova e não atualiza por cima do antigo."
          fi
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk rivo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rivo-apk
          path: rivo.apk
      - name: Apagar a release antiga (o arquivo sempre sai novo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-latest --cleanup-tag --yes || true
      - name: Publicar link direto (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: RIVO APK (mais recente)
          files: rivo.apk
          body: "build ${{ github.run_number }}"
          overwrite_files: true
          make_latest: true
